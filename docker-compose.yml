version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # VITE_* 변수는 빌드 타임에 번들에 포함됨 → build.args로 전달
        - VITE_API_URL=http://nginx/api/v1
        - VITE_KAKAO_MAP_API_KEY=${VITE_KAKAO_MAP_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - afb-network

  backend:
    build:
      # pyproject.toml이 루트에 있으므로 context를 루트로 설정
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-afbuser}
      - DB_PASSWORD=${DB_PASSWORD:-afbpassword}
      - DB_NAME=${DB_NAME:-afb_db}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_PHOTOS=${MINIO_BUCKET_PHOTOS}
      - MINIO_BUCKET_VIDEOS=${MINIO_BUCKET_VIDEOS}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_REDIRECT_URI=${NAVER_REDIRECT_URI}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
    networks:
      - afb-network

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A app.tasks celery_app worker --loglevel=info --concurrency=2
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-afbuser}
      - DB_PASSWORD=${DB_PASSWORD:-afbpassword}
      - DB_NAME=${DB_NAME:-afb_db}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_PHOTOS=${MINIO_BUCKET_PHOTOS}
      - MINIO_BUCKET_VIDEOS=${MINIO_BUCKET_VIDEOS}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
    depends_on:
      - redis
      - mysql
    volumes:
      - ./backend:/app
    networks:
      - afb-network

  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-afb_db}
      MYSQL_USER: ${DB_USER:-afbuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-afbpassword}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - afb-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - afb-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - afb-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - afb-network

  flower:
    image: mher/flower
    command: celery flower --broker=${REDIS_URL:-redis://redis:6379/0} --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - afb-network

networks:
  afb-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  minio_data:
